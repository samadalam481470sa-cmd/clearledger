worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  proxy_connect_timeout 1s;
  proxy_read_timeout 5s;
  proxy_set_header Host 127.0.0.1;
  server {
    listen 8545;
    location / { proxy_pass http://validator1:8545; }
  }
  server {
    listen 8546;
    location / { proxy_pass http://validator2:8545; }
  }
  server {
    listen 8547;
    location / { proxy_pass http://validator3:8545; }
  }
  server {
    listen 8548;
    location / { proxy_pass http://validator4:8545; }
  }
}
