name: clearledger-dev
x-validator: &validator
  image: hyperledger/besu:26.10.1@sha256:47aa21463213abcddc5972bc79443e6806c1c7c68e8f36ed33222882fbad8752
  restart: unless-stopped
  user: "${BESU_CONTAINER_UID:-1000}:${BESU_CONTAINER_GID:-1000}"
  environment: &validator-environment
    JAVA_OPTS: -Xms128m -Xmx512m
  command:
    - --data-path=/data
    - --genesis-file=/config/genesis.json
    - --node-private-key-file=/config/key
    - --static-nodes-file=/config/static-nodes.json
    - --permissions-nodes-config-file-enabled=true
    - --permissions-nodes-config-file=/config/permissions_config.toml
    - --discovery-enabled=false
    - --nat-method=NONE
    - --rpc-http-enabled=true
    - --rpc-http-host=0.0.0.0
    - --rpc-http-api=ETH,NET,WEB3,QBFT
    - --host-allowlist=localhost,127.0.0.1,validator1,validator2,validator3,validator4
    - --min-gas-price=0
    - --logging=INFO
services:
  validator1:
    <<: *validator
    hostname: validator1
    environment:
      <<: *validator-environment
      BESU_P2P_HOST: 172.28.77.11
    volumes:
      - ./generated/validator1:/config:ro
      - ./generated/validator1/data:/data
    networks:
      settlement:
        ipv4_address: 172.28.77.11
  validator2:
    <<: *validator
    hostname: validator2
    environment:
      <<: *validator-environment
      BESU_P2P_HOST: 172.28.77.12
    volumes:
      - ./generated/validator2:/config:ro
      - ./generated/validator2/data:/data
    networks:
      settlement:
        ipv4_address: 172.28.77.12
  validator3:
    <<: *validator
    hostname: validator3
    environment:
      <<: *validator-environment
      BESU_P2P_HOST: 172.28.77.13
    volumes:
      - ./generated/validator3:/config:ro
      - ./generated/validator3/data:/data
    networks:
      settlement:
        ipv4_address: 172.28.77.13
  validator4:
    <<: *validator
    hostname: validator4
    environment:
      <<: *validator-environment
      BESU_P2P_HOST: 172.28.77.14
    volumes:
      - ./generated/validator4:/config:ro
      - ./generated/validator4/data:/data
    networks:
      settlement:
        ipv4_address: 172.28.77.14
  rpc:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on: [validator1, validator2, validator3, validator4]
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:8546:8546"
      - "127.0.0.1:8547:8547"
      - "127.0.0.1:8548:8548"
    volumes:
      - ./rpc.conf:/etc/nginx/nginx.conf:ro
    networks: [settlement, rpc-access]
networks:
  rpc-access: {}
  settlement:
    internal: true
    ipam:
      config: [{subnet: 172.28.77.0/24}]

