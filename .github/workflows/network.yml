name: Besu network checks
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/network.yml
      - .node-version
      - .npm-version
      - package.json
      - package-lock.json
      - network/**
      - scripts/network.ts
      - scripts/verify-network.ts
      - scripts/quorum-observation.ts
      - scripts/deploy-network.ts
      - contracts/**
      - src/chain.ts
      - src/service.ts
      - src/store.ts
      - tests/fixtures/compile-wallet.ts
      - tests/fixtures/ContractWallet.sol
permissions:
  contents: read
jobs:
  qbft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # pinned v6 (node24)
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify reference toolchain
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$(cat .npm-version)"
      - run: npm ci
      - name: Match the runner identity for private key access
        run: |
          echo "BESU_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "BESU_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: npm run compile
      - run: npm run network:generate
      - name: Start isolated development validators
        run: docker compose -f network/compose.yaml up -d
      - name: Verify quorum, settlement, and validator recovery
        run: npm run network:verify
      - name: Validator diagnostics
        if: always()
        run: docker compose -f network/compose.yaml logs --no-color --tail=80
      - name: Remove ephemeral development network
        if: always()
        run: docker compose -f network/compose.yaml down --volumes
