name: ClearLedger checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # pinned v6 (node24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # pinned v6 (node24)
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify reference toolchain
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v$(cat .node-version)"
          test "$(npm --version)" = "$(cat .npm-version)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run source:count

